version: v0.7.1-alpha.1

dsn: memory

serve:
  public:
    base_url: https://falcon.sdslabs.co/
    cors:
      enabled: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: https://accounts.sdslabs.co/
  allowed_return_urls:
    - https://accounts.sdslabs.co/

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: sdslabs.co
      enabled: true


  flows:
    error:
      ui_url: http://127.0.0.1:4455/error

    settings:
      ui_url: https://accounts.sdslabs.co/passwordReset
      required_aal: aal1
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://accounts.sdslabs.co/recovery

    verification:
      enabled: true
      ui_url: https://accounts.sdslabs.co/verification
      after:
        default_browser_return_url: https://accounts.sdslabs.co/

    logout:
      after:
        default_browser_return_url: https://accounts.sdslabs.co/login

    login:
      ui_url: https://accounts.sdslabs.co/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: https://accounts.sdslabs.co/registration
      after:
        password:
          hooks:
            -
              hook: session

session:
  whoami:
    required_aal: aal1

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
courier:
  smtp:
    connection_uri:
